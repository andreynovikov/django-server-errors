# tox (https://tox.wiki/) runs the test suite on all supported Python and
# Django versions. To use it, "pip install tox" and run "tox" in this directory.
#
# Each Python/Django combination is tested without and with Django REST
# framework and Celery, as their integration is optional. The tests run in a
# temporary directory, so they test the installed package, not the source tree.

[tox]
envlist =
    py311-django52-{core,extras}
    py{312,313,314}-django{52,60,61}-{core,extras}
    py315-django61-{core,extras}
    flake8

skip_missing_interpreters = true

[testenv]
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    extras: djangorestframework
    extras: celery
changedir = {envtmpdir}
commands = {envpython} -W default::DeprecationWarning -m django test errors --settings=errors.tests.settings {posargs}

[testenv:flake8]
skip_install = true
changedir = {toxinidir}
deps = flake8
commands = flake8 errors

[flake8]
extend-ignore = E501

[gh]
python =
    3.15 = py315-django61-{core,extras}
    3.14 = py314-django{52,60,61}-{core,extras}
    3.13 = py313-django{52,60,61}-{core,extras}, flake8
    3.12 = py312-django{52,60,61}-{core,extras}
    3.11 = py311-django52-{core,extras}

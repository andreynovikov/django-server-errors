[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-server-errors"
version = "1.0.0"
description = "Server errors of a Django site, grouped and triaged in the Django admin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Andrey Novikov", email = "novikov@gmail.com"},
]
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2",
]
keywords = ["django", "admin", "errors", "exceptions", "error tracking", "celery"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/andreynovikov/django-server-errors"
Repository = "https://github.com/andreynovikov/django-server-errors.git"
Issues = "https://github.com/andreynovikov/django-server-errors/issues"
Releases = "https://github.com/andreynovikov/django-server-errors/releases"

[tool.setuptools.packages.find]
include = ["errors*"]
